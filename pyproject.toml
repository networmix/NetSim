[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "netsim"
version = "0.1.0"
description = "A discrete-event simulation engine."
readme = "README.md"
authors = [{ name = "Andrey Golovanov" }]
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"

classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering",
    "Topic :: System :: Networking",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: Free Threading :: 3 - Stable",
    "Operating System :: OS Independent",
    "Typing :: Typed",
]

dependencies = []

[project.scripts]
netsim = "netsim.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov",
    "pytest-benchmark",
    "pytest-mock",
    "pytest-timeout",
    "ruff==0.11.13",
    "pyright==1.1.401",
    "pre-commit",
    "build",
    "twine",
]

[tool.setuptools.packages.find]
include = ["netsim*"]
exclude = ["tests*"]

[tool.setuptools.package-data]
"netsim" = ["py.typed"]

[tool.pytest.ini_options]
addopts = "--cov=netsim --cov-fail-under=85 --cov-report term-missing --benchmark-disable --benchmark-disable-gc --benchmark-min-rounds=5 --benchmark-warmup=on"
timeout = 60  # a hang guard: shared CI runners take up to 10x longer than a workstation
markers = [
    "slow: marks tests as slow",
    "benchmark: marks tests as benchmarks",
]

[tool.coverage.run]
source = ["netsim"]
omit = ["*/tests/*", "*/test_*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
]

[tool.ruff]
line-length = 88
indent-width = 4

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B", "I"]
fixable = ["ALL"]

[tool.ruff.lint.isort]
known-first-party = ["netsim"]

[tool.ruff.format]
quote-style = "single"

[tool.pyright]
typeCheckingMode = "standard"
pythonVersion = "3.11"
venvPath = "."
venv = "venv"
exclude = [
    "tests/**",
    "output/**",
    "**/venv/**",
    "**/venv-ft/**",
    "build/**",
    "dist/**",
]
